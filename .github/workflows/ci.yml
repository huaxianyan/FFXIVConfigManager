name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      CI: true
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore FFXIVConfigManager.sln

      - name: Verify formatting
        run: dotnet format FFXIVConfigManager.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build FFXIVConfigManager.sln -c Release --no-restore

      - name: Test
        run: dotnet test FFXIVConfigManager.sln -c Release --no-build
